name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Read-only: fails when apps/api/d1-migrations has files the tk database
      # has not applied, or when D1 cannot be read. Never applies migrations.
      # Use a separate D1 Read-only token, not the Worker deployment token.
      - name: Refuse to deploy while D1 migrations are pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b8b1032c61d9475cd00229c74db7ec72
        run: scripts/check-d1-migrations.sh --env tk --remote
      - name: Build web app
        working-directory: apps/worker
        run: bun run build:web
      - name: Deploy Worker to Tinkertanker production
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b8b1032c61d9475cd00229c74db7ec72
        run: npx wrangler deploy --env tk
      - name: Verify deployment
        run: |
          sleep 10
          curl -fsS --max-time 30 https://howmuch.tk.sg/health
