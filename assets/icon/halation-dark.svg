      <stop offset="0" stop-color="#10140c"/>
      <stop offset="0.45" stop-color="#1c2013"/>
      <stop offset="1" stop-color="#332f1d"/>
    </linearGradient>
    <radialGradient id="bandD" gradientUnits="userSpaceOnUse" cx="715" cy="477" r="580">
      <stop offset="0" stop-color="#ffc670" stop-opacity="0.42"/>
      <stop offset="0.24" stop-color="#ffc670" stop-opacity="0.37"/>
      <stop offset="0.38" stop-color="#ffc670" stop-opacity="0.19"/>
      <stop offset="0.56" stop-color="#ffc670" stop-opacity="0.16"/>
      <stop offset="0.72" stop-color="#ffc670" stop-opacity="0.06"/>
      <stop offset="0.9" stop-color="#ffc670" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffc670" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreD" gradientUnits="userSpaceOnUse" cx="715" cy="477" r="215">
