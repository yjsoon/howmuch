      <stop offset="0.55" stop-color="#ffd98c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffd98c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poolD" gradientUnits="userSpaceOnUse" cx="715" cy="500" r="330">
      <stop offset="0" stop-color="#ffca75" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffca75" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poolFD" gradientUnits="userSpaceOnUse" cx="715" cy="660" r="380">
      <stop offset="0" stop-color="#ffca75" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffca75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crestD" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="0">
