<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="../src/app.css" />
  </head>
  <body>
    <form class="boot-message auth-form">
      <input data-measure="auth-text" type="text" />
      <input data-measure="auth-password" type="password" />
    </form>
    <input data-measure="search-input" class="search-input" type="search" />
    <label class="field">
      <input data-measure="field-text" type="text" />
    </label>
    <label class="field">
      <select data-measure="field-select"><option>One</option></select>
    </label>
    <input data-measure="amount-input" class="amount-input" type="number" />
    <div class="custom-range">
      <input data-measure="custom-range-date" type="date" />
    </div>
    <div class="menu-search">
      <input data-measure="menu-search" type="search" />
    </div>
    <div class="transaction-editor-split-line">
      <input data-measure="split-line-input" type="text" />
      <select data-measure="split-line-select"><option>One</option></select>
    </div>
    <form class="plan-assignment-form">
      <input data-measure="plan-assignment" type="text" />
    </form>
    <form class="plan-target-form">
      <input data-measure="plan-target-input" type="text" />
      <select data-measure="plan-target-select"><option>One</option></select>
    </form>
    <div class="split-line">
      <input data-measure="quick-split-input" type="text" />
      <select data-measure="quick-split-select"><option>One</option></select>
    </div>
    <form class="custom-group-form">
      <input data-measure="custom-group" type="text" />
    </form>
    <div class="group-sort-heading">
      <select data-measure="group-sort-select"><option>One</option></select>
    </div>
    <input data-measure="api-token-secret" class="api-token-secret" type="text" />
    <input data-measure="bare-text" type="text" />
    <select data-measure="bare-select"><option>One</option></select>
    <input data-measure="checkbox" type="checkbox" />
    <pre id="report"></pre>
    <script>
      const skip = new Set(["checkbox", "radio", "range", "hidden", "button", "submit", "reset", "color", "file", "image"]);
      const rows = [...document.querySelectorAll("[data-measure]")].map((element) => {
        const fontSize = getComputedStyle(element).fontSize;
        return {
          name: element.dataset.measure,
          type: element.type || element.tagName.toLowerCase(),
          fontSize,
          px: Number.parseFloat(fontSize),
          skip: skip.has(element.type),
        };
      });
      const failures = rows.filter((row) => !row.skip && row.px < 16);
      document.getElementById("report").textContent = JSON.stringify({ ok: failures.length === 0, failures, rows }, null, 2);
    </script>
  </body>
</html>
